<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a0f0a" />
<title>Biblioteka — Sala Załuskich</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">

    <!-- Nakładka pokazywana, gdy iPad trzymany jest pionowo -->
    <div id="rotate-overlay" class="hidden" aria-hidden="true">
      <div class="rotate-card">
        <div class="rotate-icon">⟳</div>
        <p>Obróć iPada poziomo</p>
      </div>
    </div>

    <!-- Scena o stałym rozmiarze logicznym 1366×1024, skalowana przez JS (transform: scale) -->
    <div id="scene-wrap">
      <div id="scene">

        <header id="topbar">
          <div class="topbar-left">
            <button id="menu-btn" class="icon-btn" aria-label="Menu" title="Menu">☰</button>
            <h1 id="room-title">Sala Załuskich</h1>
          </div>
          <div id="minimap" aria-label="Mini-mapa sali">
            <div id="minimap-track">
              <div class="minimap-bay-divider" style="left:25%"></div>
              <div class="minimap-bay-divider" style="left:50%"></div>
              <div class="minimap-bay-divider" style="left:75%"></div>
            </div>
            <div id="minimap-viewport"></div>
          </div>
        </header>

        <!-- Okno świata: pokazuje fragment sali (3720×804), przesuwane poziomo -->
        <main id="world-viewport" aria-label="Sala — przesuń palcem, aby się rozejrzeć">
          <div id="world-layer"></div>
          <div id="darkness"></div>
        </main>

        <!-- Dolny pasek: czary (lewo), koszyk (środek), atrament + porządek (prawo) -->
        <footer id="bottom-bar">
          <div id="bottom-spells">
            <div class="spell-slot">
              <button class="spell-btn locked" data-spell="wglad" data-unlock="1" aria-label="Czar: Wgląd">
                <span class="spell-icon">👁</span>
                <span class="spell-lock">🔒</span>
              </button>
              <span class="spell-caption">Wgląd</span>
            </div>
            <div class="spell-slot">
              <button class="spell-btn locked" data-spell="przywolanie" data-unlock="2" aria-label="Czar: Przywołanie">
                <span class="spell-icon">✦</span>
                <span class="spell-lock">🔒</span>
              </button>
              <span class="spell-caption">Przywołanie</span>
            </div>
            <div class="spell-slot">
              <button class="spell-btn locked" data-spell="skrzat" data-unlock="3" aria-label="Czar: Skrzat biblioteczny">
                <span class="spell-icon">🧙</span>
                <span class="spell-lock">🔒</span>
              </button>
              <span class="spell-caption">Skrzat</span>
            </div>
          </div>

          <div id="cart" aria-label="Koszyk na książki">
            <div class="basket-handle"></div>
            <div class="basket-weave"></div>
            <span id="basket-counter">0 / 6</span>
          </div>

          <div id="bottom-right">
            <button id="inkwell" aria-label="Atrament" title="Atrament">
              <span class="inkwell-icon">🖋</span>
              <span class="inkwell-gauge"><span id="inkwell-fill" class="inkwell-fill"></span></span>
              <span class="inkwell-label"><span id="ink-count">0</span><span class="ink-max">/20</span></span>
            </button>
            <button id="order-ring" aria-label="Porządek sali">
              <svg viewBox="0 0 72 72">
                <circle class="ring-track" cx="36" cy="36" r="30" />
                <circle class="ring-fill" id="order-ring-fill" cx="36" cy="36" r="30" />
              </svg>
              <span id="order-ring-percent">0%</span>
            </button>
          </div>
        </footer>

        <!-- Warstwa okładek w koszyku — w koordynatach SCENY (nie świata), nad paskiem dolnym -->
        <div id="basket-layer"></div>

        <!-- Warstwa aktywnego przeciągania — nad wszystkim, poza obcięciem okna świata -->
        <div id="drag-layer"></div>

        <!-- Chmurka podglądu przy unoszeniu rysika/myszy -->
        <div id="hover-tip" class="hidden"></div>

        <!-- Chmurka komunikatów (pomyłka, pełny koszyk, zablokowany stos, kurz, podpowiedzi) -->
        <div id="msg-tip" class="hidden"></div>

        <!-- Baner ukończenia regału / ładu chronologicznego -->
        <div id="shelf-banner" class="hidden"></div>

        <!-- Dymek informacyjny HUD (czary, atrament, porządek) -->
        <div id="spell-tip" class="hidden"></div>

        <!-- Karta książki -->
        <div id="book-modal" class="modal hidden" role="dialog" aria-modal="true">
          <div class="modal-backdrop" data-close="book"></div>
          <div class="modal-card book-card">
            <button class="modal-close" data-close="book" aria-label="Zamknij">✕</button>
            <div class="book-card-cover" id="book-card-cover">
              <div class="book-card-genre-icon" id="book-card-genre-icon"></div>
            </div>
            <div class="book-card-info">
              <h2 id="book-card-title"></h2>
              <p id="book-card-author"></p>
              <p id="book-card-year"></p>
              <p id="book-card-series" class="hidden"></p>
              <p id="book-card-genre"></p>
              <p id="book-card-epoch"></p>
              <p id="book-card-hint" class="hint-text"></p>
            </div>
          </div>
        </div>

        <!-- Modal potwierdzenia "Zacznij od nowa" -->
        <div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true">
          <div class="modal-backdrop" data-close="confirm"></div>
          <div class="modal-card confirm-card">
            <h2>Zacząć od nowa?</h2>
            <p>Cały postęp w tej sali zostanie wymazany. Tej operacji nie da się cofnąć.</p>
            <div class="confirm-actions">
              <button id="confirm-cancel" class="btn btn-ghost">Anuluj</button>
              <button id="confirm-restart" class="btn btn-danger">Tak, zacznij od nowa</button>
            </div>
          </div>
        </div>

        <!-- Menu (☰) -->
        <div id="menu-modal" class="modal hidden" role="dialog" aria-modal="true">
          <div class="modal-backdrop" data-close="menu"></div>
          <div class="modal-card menu-card">
            <button class="modal-close" data-close="menu" aria-label="Zamknij">✕</button>
            <h2>Menu</h2>
            <button id="menu-resume-btn" class="btn btn-block">Wróć do gry</button>
            <button id="menu-howto-btn" class="btn btn-block">Jak grać</button>
            <button id="menu-settings-btn" class="btn btn-block">Ustawienia</button>
            <button id="menu-restart-btn" class="btn btn-danger btn-block">Zacznij od nowa</button>
            <button id="menu-title-btn" class="btn btn-ghost btn-block">Ekran tytułowy</button>
          </div>
        </div>

        <!-- Ustawienia -->
        <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true">
          <div class="modal-backdrop" data-close="settings"></div>
          <div class="modal-card settings-card">
            <button class="modal-close" data-close="settings" aria-label="Zamknij">✕</button>
            <h2>Ustawienia</h2>

            <div class="settings-row">
              <span class="settings-label">Muzyka</span>
              <label class="switch">
                <input type="checkbox" id="setting-music-on" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </label>
              <input type="range" id="setting-music-volume" class="settings-range" min="0" max="100" value="70" aria-label="Głośność muzyki" />
            </div>

            <div class="settings-row">
              <span class="settings-label">Dźwięki</span>
              <label class="switch">
                <input type="checkbox" id="setting-sounds-on" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </label>
            </div>

            <div class="settings-row settings-row-col">
              <span class="settings-label">Rozmiar napisów</span>
              <div class="segmented" id="setting-text-scale">
                <button type="button" class="segmented-btn" data-scale="1">Normalny</button>
                <button type="button" class="segmented-btn" data-scale="1.2">Duży</button>
                <button type="button" class="segmented-btn" data-scale="1.4">Bardzo duży</button>
              </div>
            </div>
          </div>
        </div>

        <!-- "Jak grać" — 6 kart -->
        <div id="howto-modal" class="modal hidden" role="dialog" aria-modal="true">
          <div class="modal-backdrop" data-close="howto"></div>
          <div class="modal-card howto-card" id="howto-card">
            <button class="modal-close" data-close="howto" aria-label="Zamknij">✕</button>
            <div class="howto-icon" id="howto-icon">🏛️</div>
            <p class="howto-text" id="howto-text"></p>
            <div class="howto-dots" id="howto-dots"></div>
            <div class="howto-actions">
              <button id="howto-back-btn" class="btn btn-ghost">Wstecz</button>
              <button id="howto-next-btn" class="btn btn-primary">Dalej</button>
            </div>
          </div>
        </div>

        <!-- Ekran powitalny -->
        <div id="welcome-modal" class="modal hidden" role="dialog" aria-modal="true">
          <div class="welcome-bg"></div>
          <div class="modal-backdrop"></div>
          <div class="welcome-card">
            <div class="welcome-flower welcome-flower-tl" aria-hidden="true"></div>
            <div class="welcome-flower welcome-flower-tr" aria-hidden="true"></div>
            <div class="welcome-flower welcome-flower-bl" aria-hidden="true"></div>
            <div class="welcome-flower welcome-flower-br" aria-hidden="true"></div>
            <h1 class="welcome-title">Biblioteka</h1>
            <p class="welcome-subtitle">Sala Załuskich</p>
            <div class="welcome-actions">
              <button id="welcome-continue-btn" class="btn btn-primary btn-block hidden">Kontynuuj</button>
              <button id="welcome-newgame-btn" class="btn btn-block">Nowa gra</button>
              <button id="welcome-howto-btn" class="btn btn-block">Jak grać</button>
              <button id="welcome-settings-btn" class="btn btn-ghost btn-block">Ustawienia</button>
            </div>
          </div>
        </div>

        <!-- Ekran końcowy -->
        <div id="end-modal" class="modal hidden" role="dialog" aria-modal="true">
          <div class="modal-backdrop"></div>
          <div class="modal-card end-card">
            <h2>Sala Załuskich lśni porządkiem!</h2>
            <p id="end-mistakes"></p>
            <p id="end-time"></p>
            <p id="end-epoch"></p>
            <button id="end-restart-btn" class="btn btn-primary btn-block">Zacznij od nowa</button>
          </div>
        </div>

      </div>
    </div>

  </div>
  <script type="module" src="js/game.js"></script>
</body>
</html>
